<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - E-Shop</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navegación simplificada para el Login -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3 shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold fs-4 text-dark m-0" href="../index.html">
                <i class="bi bi-lightning-charge-fill text-primary me-1"></i> E-Shop
            </a>
        </div>
    </nav>

    <!-- Contenedor Principal del Login -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            
            <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">Bienvenido de nuevo</h2>
                    <p class="text-secondary small">Ingresa tus credenciales para continuar.</p>
                </div>

                <form id="loginForm">
                    <!-- Input Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium small text-dark">Correo Electrónico</label>
                        <input type="email" class="form-control rounded-pill px-4 py-2 bg-light border-0" id="email" placeholder="nombre@ejemplo.com" required>
                    </div>

                    <!-- Input Contraseña -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-medium small text-dark">Contraseña</label>
                            <a href="#" class="small text-primary text-decoration-none">¿La olvidaste?</a>
                        </div>
                        <input type="password" class="form-control rounded-pill px-4 py-2 bg-light border-0" id="password" placeholder="••••••••" required>
                    </div>

                    <!-- Botón Ingresar -->
                    <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-medium mb-3">Iniciar Sesión</button>
                    
                    <div class="text-center">
                        <p class="small text-secondary mb-0">¿No tienes una cuenta? <a href="registro.html" class="text-primary text-decoration-none fw-medium">Regístrate aquí</a></p>
                    </div>
                </form>
            </div>
            
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script de conexión al Login (AGREGAR ESTA LÍNEA) -->
    <script src="../assets/js/login.js"></script>

</body>
</html>
